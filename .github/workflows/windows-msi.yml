name: Windows MSI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows-msi:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up MSVC Developer Command Prompt
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio installation with MSVC tools was not found"
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -in @("Path", "INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "VSINSTALLDIR", "VisualStudioVersion")) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.9.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      - name: Verify tools
        shell: pwsh
        run: |
          msbuild /version
          candle.exe -?
          light.exe -?

      - name: Set version (tag or dev)
        id: setver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $base = ''
            if (Test-Path VERSION) {
              $base = (Get-Content VERSION -Raw).Trim()
            }
            if (-not $base) { $base = '0.0.0' }
            $sha = $env:GITHUB_SHA.Substring(0,7)
            $ver = "$base-dev+$sha"
          }
          echo "SYNERGY_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Python venv and requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python scripts/setup_venv.py

      - name: Install build dependencies
        shell: pwsh
        run: |
          python scripts/install_deps.py

      - name: Configure (CMake windows-release preset)
        shell: pwsh
        run: |
          cmake -B build --preset=windows-release -DBUILD_INSTALLER=ON -DCMAKE_BUILD_TYPE=Release -DQT_PATH="$env:Qt6_DIR"

      - name: Build binaries
        shell: pwsh
        run: |
          cmake --build build -j 8 --config Release

      - name: Package MSI
        env:
          SYNERGY_VERSION: ${{ env.SYNERGY_VERSION }}
        shell: pwsh
        run: |
          python scripts/package.py

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: synergy-msi-${{ env.SYNERGY_VERSION }}
          path: dist/*.msi
          if-no-files-found: error
